# Render Blueprint Configuration
# This file automates the deployment of both the FastAPI backend and React frontend.

services:
  # 1. FastAPI Backend
  - type: web
    name: fluxline-backend
    env: python
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # The database path. SQLite is ephemeral on Render's free tier,
      # but Render supports persisting data if you upgrade to a paid disk.
      - key: DB_PATH
        value: /opt/render/project/src/backend/data/fluxline.db
      # Add your OpenAI API key in the Render Dashboard securely!
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        value: admin123
      # Automatically set CORS origins to the frontend URL dynamically during build
      - key: ALLOWED_ORIGINS
        value: '*'

  # 2. React Frontend
  - type: web
    name: fluxline-frontend
    env: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false

    routes:
      # Redirect all unknown routes to index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html
