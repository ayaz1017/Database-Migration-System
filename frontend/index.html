    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What databases does Fluxline support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fluxline supports MSSQL (SQL Server), MySQL, PostgreSQL, and Oracle in all migration directions — any to any."
          }
        },
        {
          "@type": "Question", 
          "name": "How is Fluxline different from other migration tools?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fluxline uses a compiled algebraic type matrix for schema translation instead of asking an LLM to guess column types. This produces the same result every time, unlike non-deterministic AI-based tools."
          }
        },
        {
          "@type": "Question",
          "name": "Does Fluxline handle foreign key dependencies automatically?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Fluxline automatically resolves foreign key dependencies using graph traversal, detects circular references, and determines the correct migration order so tables are always created in the right sequence."
          }
        },
        {
          "@type": "Question",
          "name": "Can Fluxline migrate stored procedures and triggers?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Fluxline translates views, stored procedures, and triggers between SQL dialects using AI-assisted translation with human review before applying to the target database."
          }
        }
      ]
    }
