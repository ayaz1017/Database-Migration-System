# ──────────────────────────────────────────────────────
# Fluxline — Docker Compose (Development / Local)
# Usage: docker compose --env-file .env.docker up -d
# ──────────────────────────────────────────────────────

services:

  ollama:
    image: ollama/ollama:latest
    container_name: fluxline-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fluxline-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - DB_PATH=/app/data/migrations.db
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fluxline-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy

  # One-shot init container: pulls the LLM model into the shared volume
  ollama-setup:
    image: ollama/ollama:latest
    container_name: fluxline-ollama-setup
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "ollama pull ${OLLAMA_MODEL:-llama3.1:8b} &&
             echo 'Model ready'"
    restart: "no"

volumes:
  sqlite_data:
    driver: local
  ollama_data:
    driver: local
