version: "3.9"

services:

  # ─────────────────────────────────────
  # Ollama — Local LLM
  # Requires 8GB+ RAM on host machine
  # ─────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: fluxline-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      # Persist downloaded models
      # so they survive container restarts
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    deploy:
      resources:
        limits:
          memory: 10G
        reservations:
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", 
        "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────
  # Ollama Model Puller
  # Runs once to download llama3.1:8b
  # ─────────────────────────────────────
  ollama-puller:
    image: ollama/ollama:latest
    container_name: fluxline-ollama-puller
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: >
      sh -c "
        ollama pull llama3.1:8b &&
        echo 'Model ready'
      "
    restart: "no"

  # ─────────────────────────────────────
  # Backend — FastAPI
  # ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fluxline-backend
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database
      - ./data:/app/data
      # Persist uploaded files if any
      - ./uploads:/app/uploads
    environment:
      # Database
      - DB_PATH=/app/data/fluxline.db
      
      # Ollama — points to ollama service
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - LLM_PROVIDER=ollama
      
      # Auth
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      
      # Admin defaults (change these!)
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@fluxline.local}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-changeme123}
      
      # Performance
      - MAX_PARALLEL_TABLES=4
      - CHUNK_SIZE_XLARGE=100000
      - CHUNK_SIZE_LARGE=50000
      - CHUNK_SIZE_MEDIUM=10000
      - CHUNK_SIZE_SMALL=1000
      
      # CORS — allow frontend
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:80
      
      # Environment
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f",
        "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────
  # Frontend — React + nginx
  # ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass API URL at build time
        - VITE_API_URL=http://localhost:8000
        - VITE_WS_URL=ws://localhost:8000
    container_name: fluxline-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q",
        "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ollama_models:
    name: fluxline-ollama-models
