# Production overrides — use with:
# docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  ollama:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Don't expose Ollama port externally in production
    ports: !override []

  backend:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      - LOG_LEVEL=WARNING
    # Don't expose backend port externally — nginx proxies it
    ports: !override []

  frontend:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
